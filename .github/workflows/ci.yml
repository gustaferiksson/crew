name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - id: diff
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -vE '^(docs|server/crew-push)/|\.md$' | grep -q . || echo "$files" | grep -qE '^(Sources|Tests/fixtures)/.*\.md$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    strategy:
      matrix:
        platform: [ mac, ios ]
    env:
      MARKETING_VERSION: ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build tools
        run: brew install xcodegen

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-app-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            xcode-app-${{ matrix.platform }}-
            xcode-app-

      - name: Build (fails on any warning)
        run: ./build.sh ${{ matrix.platform }}

      # The same overrides as build.sh's Mac build, so the tests reuse its products instead of rebuilding them.
      - name: Test
        if: ${{ matrix.platform == 'mac' }}
        run: |
          xcodebuild test -project Crew.xcodeproj -scheme CrewTests -derivedDataPath .build -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipMacroValidation \
            "MARKETING_VERSION=$MARKETING_VERSION" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-app-${{ matrix.platform }}-${{ github.sha }}

  # Branch protection requires this check name.
  app:
    name: Build macOS and iOS (unsigned)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "build ${{ needs.build.result }}" && [ "${{ needs.build.result }}" != failure ] && [ "${{ needs.build.result }}" != cancelled ]

  plugin:
    name: crew-push tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/crew-push
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Plugin version strings agree
        run: |
          set -euo pipefail
          versions=$(printf '%s\n' \
            "$(sed -nE 's/^version: *(.*)$/\1/p' plugin.yaml)" \
            "$(sed -nE 's/^version *= *"(.*)"$/\1/p' pyproject.toml)" \
            "$(sed -nE 's/^PLUGIN_VERSION *= *"(.*)"$/\1/p' crew_push/__init__.py)" \
            "$(python -c 'import json; print(json.load(open("dashboard/manifest.json"))["version"])')")
          echo "$versions"
          [ "$(echo "$versions" | grep -c .)" = 4 ] && [ "$(echo "$versions" | sort -u | grep -c .)" = 1 ]

      - name: crew-ui skill frontmatter
        working-directory: .
        run: |
          set -euo pipefail
          frontmatter=$(awk 'NR == 1 && $0 == "---" { next } $0 == "---" { exit } { print }' Sources/Profile/crew-ui.SKILL.md)
          name=$(echo "$frontmatter" | sed -nE 's/^name: *(.*)$/\1/p')
          version=$(echo "$frontmatter" | sed -nE 's/^version: *(.*)$/\1/p')
          description=$(echo "$frontmatter" | sed -nE 's/^description: *(.*)$/\1/p')
          echo "name=$name version=$version description(${#description})=$description"
          [ -n "$name" ] && [ -n "$version" ] && [ -n "$description" ] && [ "${#description}" -le 60 ]

      - name: SwiftUI lint
        working-directory: .
        run: scripts/lint-ui.sh

      - name: Install test dependencies
        run: pip install pytest httpx h2 'PyJWT[crypto]' fastapi

      - name: Test
        run: python -m pytest -q
