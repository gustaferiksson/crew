name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - id: diff
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -vE '^(docs|server/crew-push)/|\.md$' | grep -q . || echo "$files" | grep -qE '^(Sources|Tests/fixtures)/.*\.md$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  app:
    name: Build macOS and iOS (unsigned)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build tools
        run: brew install xcodegen

      - name: Build (fails on any warning)
        run: ./build.sh

      - name: Build UI tests
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -quiet -project Crew.xcodeproj -scheme CrewUITests -derivedDataPath .build -skipPackagePluginValidation -skipMacroValidation \
            -destination 'platform=iOS Simulator,OS=27.0,name=iPhone 18 Pro' CODE_SIGNING_ALLOWED=NO
          cd .build/Build/Products
          tar -cf "$GITHUB_WORKSPACE/ui-build.tar" Debug-iphonesimulator CrewUITests_*.xctestrun

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-build
          path: ui-build.tar
          retention-days: 1

      - name: Test
        run: xcodebuild test -project Crew.xcodeproj -scheme CrewTests -derivedDataPath .build -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipMacroValidation

  ui:
    name: UI tests (iOS Simulator, ${{ matrix.shard }})
    needs: [changes, app]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.app.result == 'success' }}
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: composer
            tests: -only-testing:CrewUITests/ChatSendScrollUITests -only-testing:CrewUITests/ComposerUITests -only-testing:CrewUITests/InAppBrowserUITests
          - shard: rest
            tests: -skip-testing:CrewUITests/ChatSendScrollUITests -skip-testing:CrewUITests/ComposerUITests -skip-testing:CrewUITests/InAppBrowserUITests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot the simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl create crew-ui "iPhone 18 Pro" com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          xcrun simctl bootstatus "$device" -b >/dev/null
          echo "UI_DEVICE=$device" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-build

      - name: Unpack the build from the app job
        run: |
          set -euo pipefail
          mkdir -p .build/Build/Products
          tar -xf ui-build.tar -C .build/Build/Products

      - name: UI tests
        run: Tests/ui.sh ${{ matrix.tests }} -resultBundlePath ui-${{ matrix.shard }}.xcresult

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: ui-${{ matrix.shard }}-results
          path: ui-${{ matrix.shard }}.xcresult
          retention-days: 7

  mac-ui:
    name: UI tests (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build tools
        run: brew install xcodegen

      - name: UI tests
        run: |
          set -euo pipefail
          xcodegen generate --quiet
          xcodebuild test -project Crew.xcodeproj -scheme CrewMacUITests -derivedDataPath .build -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation -skipMacroValidation -resultBundlePath mac-ui.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: mac-ui-results
          path: mac-ui.xcresult
          retention-days: 7

  plugin:
    name: crew-push tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/crew-push
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Plugin version strings agree
        run: |
          set -euo pipefail
          versions=$(printf '%s\n' \
            "$(sed -nE 's/^version: *(.*)$/\1/p' plugin.yaml)" \
            "$(sed -nE 's/^version *= *"(.*)"$/\1/p' pyproject.toml)" \
            "$(sed -nE 's/^PLUGIN_VERSION *= *"(.*)"$/\1/p' crew_push/__init__.py)" \
            "$(python -c 'import json; print(json.load(open("dashboard/manifest.json"))["version"])')")
          echo "$versions"
          [ "$(echo "$versions" | grep -c .)" = 4 ] && [ "$(echo "$versions" | sort -u | grep -c .)" = 1 ]

      - name: crew-ui skill frontmatter
        working-directory: .
        run: |
          set -euo pipefail
          frontmatter=$(awk 'NR == 1 && $0 == "---" { next } $0 == "---" { exit } { print }' Sources/Profile/crew-ui.SKILL.md)
          name=$(echo "$frontmatter" | sed -nE 's/^name: *(.*)$/\1/p')
          version=$(echo "$frontmatter" | sed -nE 's/^version: *(.*)$/\1/p')
          description=$(echo "$frontmatter" | sed -nE 's/^description: *(.*)$/\1/p')
          echo "name=$name version=$version description(${#description})=$description"
          [ -n "$name" ] && [ -n "$version" ] && [ -n "$description" ] && [ "${#description}" -le 60 ]

      - name: Install test dependencies
        run: pip install pytest httpx h2 'PyJWT[crypto]' fastapi

      - name: Test
        run: python -m pytest -q
