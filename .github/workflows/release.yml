name: Release

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
    paths-ignore: [ 'docs/**' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  macos:
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@6d88888e7a9b6418de945c26f96a468a40075b9a # v0.1.0
    secrets: inherit
    with:
      # AppUpdater downloads Crew-<version>.zip, and the shared workflow names the zip after `name`.
      name: Crew
      app: dist/Crew.app
      cask: crew
      runner: xcode-27
      signed_by_build: true
      build: |
        brew install xcodegen
        ./package.sh mac
      cache_paths: |
        .build/CompilationCache.noindex
        .build/SDKExplicitPrecompiledModules
        .build/SourcePackages
      cache_key: xcode-release-mac-${{ github.sha }}
      cache_restore_keys: xcode-release-mac-

  macos-cache:
    if: ${{ github.ref_type != 'tag' }}
    name: macOS build cache
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-release-mac-${{ github.sha }}
          restore-keys: xcode-release-mac-

      - name: Build Release for macOS, unsigned
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Crew.xcodeproj -scheme Crew -configuration Release -derivedDataPath .build -quiet -skipPackagePluginValidation -skipMacroValidation \
            -destination 'generic/platform=macOS' MARKETING_VERSION=0.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-release-mac-${{ github.sha }}

  ios:
    name: iOS build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Preflight, every iOS secret is set
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_ADHOC_PROFILE: ${{ secrets.IOS_ADHOC_PROFILE }}
          IOS_WIDGETS_ADHOC_PROFILE: ${{ secrets.IOS_WIDGETS_ADHOC_PROFILE }}
        run: |
          set -euo pipefail
          for name in IOS_DIST_P12 IOS_DIST_P12_PASSWORD IOS_ADHOC_PROFILE IOS_WIDGETS_ADHOC_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is empty, refusing to release"
              exit 1
            fi
          done

      - name: Import the Apple Distribution certificate and Ad Hoc profiles
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_ADHOC_PROFILE: ${{ secrets.IOS_ADHOC_PROFILE }}
          IOS_WIDGETS_ADHOC_PROFILE: ${{ secrets.IOS_WIDGETS_ADHOC_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" \
            || { echo "::error::no Apple Distribution identity in the imported keychain"; exit 1; }
          echo "$IOS_ADHOC_PROFILE" | base64 --decode > "$RUNNER_TEMP/Crew_AdHoc.mobileprovision"
          echo "$IOS_WIDGETS_ADHOC_PROFILE" | base64 --decode > "$RUNNER_TEMP/Crew_Widgets_AdHoc.mobileprovision"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-release-ios-${{ github.sha }}
          restore-keys: xcode-release-ios-

      - name: Build the IPA
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          brew install xcodegen
          VERSION="${VERSION#v}" IOS_ADHOC_PROFILE_PATH="$RUNNER_TEMP/Crew_AdHoc.mobileprovision" \
            IOS_WIDGETS_ADHOC_PROFILE_PATH="$RUNNER_TEMP/Crew_Widgets_AdHoc.mobileprovision" ./package.sh ios

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: |
            dist/Crew.ipa
            dist/manifest.plist
          retention-days: 7

  ios-cache:
    if: ${{ github.ref_type != 'tag' }}
    name: iOS build cache
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-release-ios-${{ github.sha }}
          restore-keys: xcode-release-ios-

      - name: Build Release for iOS, unsigned
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Crew.xcodeproj -scheme Crew -configuration Release -derivedDataPath .build -quiet -skipPackagePluginValidation -skipMacroValidation \
            -destination 'generic/platform=iOS' MARKETING_VERSION=0.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build

      # A cache saved on a tag is visible only to that tag, so main saves the one the next tag restores.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-release-ios-${{ github.sha }}

  publish:
    # The shared workflow creates the release, so this job only uploads to it.
    needs: [ macos, ios ]
    name: iOS, plugin and Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios
          path: dist

      - name: Upload the IPA, manifest and crew-push to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plugin=$(sed -nE 's/^version: *(.*)$/\1/p' server/crew-push/plugin.yaml)
          cp dist/Crew.ipa "dist/Crew-$version.ipa"
          git archive --format=tar.gz --prefix=crew-push/ -o "dist/crew-push-$plugin.tar.gz" HEAD:server/crew-push
          gh release upload "$GITHUB_REF_NAME" "dist/Crew-$version.ipa" dist/manifest.plist "dist/crew-push-$plugin.tar.gz"

      - name: Stage the install page
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          cp pages/* dist/Crew.ipa dist/manifest.plist "$RUNNER_TEMP/pages/"

      - id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      # Deploys by artifact id: actions/deploy-pages looks the artifact up by name and often misses it (actions/deploy-pages#451).
      - id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          oidc_token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc_token"
          deployment=$(jq -n --argjson artifact_id "$ARTIFACT_ID" --arg version "$GITHUB_SHA" --arg oidc_token "$oidc_token" \
            '{artifact_id: $artifact_id, pages_build_version: $version, oidc_token: $oidc_token}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input -)
          id=$(jq -r '.id // (.status_url | split("/") | last)' <<< "$deployment")
          echo "page_url=$(jq -r .page_url <<< "$deployment")" >> "$GITHUB_OUTPUT"

          deadline=$((SECONDS + 600))
          while ((SECONDS < deadline)); do
            sleep 5
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status)
            echo "Pages deployment status: $status"
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed | deployment_content_failed | deployment_cancelled | deployment_lost) exit 1 ;;
            esac
          done
          echo "Timed out waiting for the Pages deployment"
          exit 1
