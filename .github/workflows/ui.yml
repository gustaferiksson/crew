name: UI tests

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!docs/**'
      - '!server/crew-push/**'
      - '!**.md'
      - 'Sources/**/*.md'
      - 'Tests/fixtures/**/*.md'
  workflow_dispatch:

concurrency:
  group: ui-tests-diag90
  cancel-in-progress: true

jobs:
  mac:
    name: UI tests (macOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build tools
        run: brew install xcodegen

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-ui-mac-${{ github.sha }}
          restore-keys: |
            xcode-ui-mac-
            xcode-app-

      - name: UI tests
        run: |
          set -euo pipefail
          xcodegen generate --quiet
          xcodebuild test -project Crew.xcodeproj -scheme CrewMacUITests -derivedDataPath .build -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation -skipMacroValidation -resultBundlePath mac-ui.xcresult -only-testing:CrewMacUITests/ChatWindowUITests -test-iterations 10 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: |
            .build/CompilationCache.noindex
            .build/SDKExplicitPrecompiledModules
            .build/SourcePackages
          key: xcode-ui-mac-${{ github.sha }}

      - name: Click log
        if: ${{ always() }}
        run: find /var/folders /tmp -name crew-diag.log -exec cat {} + 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: mac-ui-results
          path: mac-ui.xcresult
          retention-days: 7
