name: Crew
options:
  bundleIdPrefix: dev.gustaf
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
packages:
  A2UI:
    url: https://github.com/a2ui-project/a2ui
    revision: 4ca7353f81ce5339bb4a4d718af027dbff60e2ef
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    COMPILATION_CACHE_ENABLE_CACHING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
schemes:
  CrewTests:
    build:
      targets:
        CrewTests: [test]
    test:
      targets: [CrewTests]
  CrewUITests:
    build:
      targets:
        CrewUITests: [test]
    test:
      targets: [CrewUITests]
  CrewMacUITests:
    build:
      targets:
        CrewMacUITests: [test]
    test:
      targets: [CrewMacUITests]
targets:
  Crew:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    scheme: {}
    dependencies:
      - package: A2UI
        products: [A2UISwiftCore, A2UISwiftUI, BasicCatalog, BasicCatalogSwiftUI]
      - target: CrewWidgets
        destinationFilters: [iOS]
    sources:
      - path: Sources
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.crew
        PRODUCT_NAME: Crew
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Crew connects to your Hermes server on the local network or over VPN.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Crew listens while you dictate a message or talk to a bot.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Crew turns your dictation into text on this device.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_FILE[sdk=iphoneos*]: Info-iOS.plist
        INFOPLIST_FILE[sdk=iphonesimulator*]: Info-iOS.plist
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_HARDENED_RUNTIME: YES
        CREW_ENTITLEMENTS_iphoneos: Entitlements/Crew-iOS.entitlements
        CREW_ENTITLEMENTS_iphonesimulator: Entitlements/Crew-iOS.entitlements
        CREW_ENTITLEMENTS_macosx: Entitlements/Crew-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS: $(CREW_ENTITLEMENTS_$(PLATFORM_NAME))
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          DEVELOPMENT_TEAM: 82K3YC8HVF
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=macosx*]: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: Crew Developer ID
          OTHER_CODE_SIGN_FLAGS[sdk=macosx*]: --timestamp
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Crew Ad Hoc
  CrewWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/Voice/VoiceShared.swift
      - Sources/Voice/VoiceBot.swift
      - Sources/AvatarView.swift
      - Sources/AvatarShape.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Crew
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.crew.widgets
        PRODUCT_NAME: CrewWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        CODE_SIGN_ENTITLEMENTS: Entitlements/CrewWidgets.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          DEVELOPMENT_TEAM: 82K3YC8HVF
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Crew Widgets Ad Hoc
  CrewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Gateway.swift
      - Sources/GatewayTypes.swift
      - Sources/Hermes.swift
      - Sources/BotStore.swift
      - Sources/Profile/ProfileTypes.swift
      - Sources/Chat/Transcript.swift
      - Sources/Chat/MarkdownBlocks.swift
      - Sources/Chat/ReplyTextView.swift
      - Sources/Chat/Attachments.swift
      - Sources/Chat/AttachmentViews.swift
      - Sources/Chat/ChatSession.swift
      - Sources/Chat/ChatSessions.swift
      - Sources/Chat/ChatDrafts.swift
      - Sources/Chat/Composer.swift
      - Sources/Chat/Dictation.swift
      - Sources/Chat/RequestCards.swift
      - Sources/Chat/Payments.swift
      - Sources/Chat/PaymentCard.swift
      - Sources/Chat/TranscriptScroll.swift
      - Sources/Push/PushRoute.swift
      - Sources/Chat/Mentions.swift
      - Sources/Chat/SlashCommands.swift
      - Sources/Profile/ProfileDraft.swift
      - Sources/Profile/CrewUISkill.swift
      - Sources/AvatarShape.swift
      - Sources/BotAvatar.swift
      - Sources/BotRow.swift
      - Sources/AvatarView.swift
      - Sources/Chat/A2UI/MapPinPoint.swift
      - Sources/Chat/A2UI/CachedImage.swift
      - Sources/Chat/A2UI/SystemSymbol.swift
      - Sources/Groups/GroupStore.swift
      - Sources/Groups/GroupSession.swift
      - Sources/Groups/RoomHistory.swift
      - Sources/Search/MessageSearch.swift
      - Sources/Links.swift
      - Sources/Scenes.swift
      - Sources/Inspector/Vault.swift
      - Sources/Inspector/MCP.swift
      - Sources/NewBotAdvanced.swift
      - Sources/Voice/VoiceBot.swift
      - Tests/CrewTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.crew-tests
        GENERATE_INFOPLIST_FILE: YES
  CrewUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: Crew
    sources:
      - Tests/CrewUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.crew-uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Crew
  CrewMacUITests:
    type: bundle.ui-testing
    platform: macOS
    dependencies:
      - target: Crew
    sources:
      - Tests/CrewMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.crew-macuitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Crew
